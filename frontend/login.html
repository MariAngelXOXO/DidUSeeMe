<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Did U See Me? - Entrar / Cadastrar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Did U See Me?</h1>
    <p><a href="index.html" style="color: white;">← Voltar para a Página Inicial</a></p>
  </header>

  <main class="container auth-container">
    <div class="auth-box">
      <h2 id="auth-title">Entrar na Conta</h2>
      <form id="auth-form">
        <div id="name-field-group" class="hidden">
          <label>Nome Completo:</label>
          <input type="text" id="nome" placeholder="Seu nome">
        </div>
        <label>E-mail:</label>
        <input type="email" id="email" placeholder="seu@email.com" required>

        <label>Senha:</label>
        <input type="password" id="senha" placeholder="Sua senha" required>

        <button type="submit" id="auth-btn" class="btn">Entrar</button>
      </form>
      <p id="toggle-auth-mode">Não tem uma conta? <a href="#" id="switch-mode">Cadastre-se</a></p>
    </div>
  </main>

  <script src="auth.js"></script>
</body>
</html>
